<style>

    /* =========================================================
       01 — DESIGN TOKENS
       ========================================================= */

    :root {

        --blue-950: #041225;
        --blue-900: #061A35;
        --blue-850: #071D3A;
        --blue-800: #09274E;
        --blue-750: #0B315F;
        --blue-700: #0E4078;
        --blue-600: #145B9E;
        --blue-500: #2179C6;

        --orange-950: #5C2000;
        --orange-900: #762800;
        --orange-800: #983500;
        --orange-700: #B94400;
        --orange-600: #D95700;
        --orange-500: #F26A00;
        --orange-400: #FF7A18;

        --white: #FFFFFF;

        --white-90: rgba(255,255,255,.90);
        --white-75: rgba(255,255,255,.75);
        --white-55: rgba(255,255,255,.55);
        --white-35: rgba(255,255,255,.35);
        --white-20: rgba(255,255,255,.20);
        --white-12: rgba(255,255,255,.12);
        --white-08: rgba(255,255,255,.08);

        --danger: #FF5C5C;
        --success: #42D392;
        --warning: #FFB020;

        --shadow-xl:
            0 35px 100px rgba(0,0,0,.42);

        --shadow-orange:
            0 16px 45px rgba(242,106,0,.24);

        --radius-card: 34px;
        --radius-input: 17px;
        --radius-button: 17px;

        --ease:
            cubic-bezier(.2,.8,.2,1);

    }


    /* =========================================================
       02 — RESET
       ========================================================= */

    *,
    *::before,
    *::after {

        box-sizing: border-box;

        margin: 0;

        padding: 0;

        -webkit-tap-highlight-color: transparent;

    }


    html {

        width: 100%;

        min-height: 100%;

        overflow-x: hidden;

        overflow-y: auto;

        scroll-behavior: smooth;

    }


    body {

        width: 100%;

        min-height: 100vh;

        min-height: 100svh;

        margin: 0;

        color: var(--white);

        background: var(--blue-950);

        font-family:
            Inter,
            ui-sans-serif,
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;

        overflow-x: hidden;

        touch-action: manipulation;

        -webkit-font-smoothing: antialiased;

        text-rendering: optimizeLegibility;

    }


    button,
    input {

        font: inherit;

    }


    button {

        border: 0;

        outline: none;

    }


    a {

        color: inherit;

    }


    ::selection {

        background: rgba(242,106,0,.35);

        color: white;

    }


    /* =========================================================
       03 — APPLICATION BACKGROUND
       ========================================================= */

    .app {

        position: relative;

        width: 100%;

        min-height: 100vh;

        min-height: 100svh;

        display: grid;

        place-items: center;

        padding: clamp(12px,3vw,34px);

        isolation: isolate;

        overflow: hidden;

    }


    .background {

        position: absolute;

        inset: 0;

        z-index: -10;

        overflow: hidden;

        background:
            radial-gradient(
                circle at 15% 15%,
                rgba(33,121,198,.25),
                transparent 32%
            ),
            radial-gradient(
                circle at 86% 80%,
                rgba(242,106,0,.20),
                transparent 30%
            ),
            linear-gradient(
                135deg,
                #041225 0%,
                #071D3A 48%,
                #061A35 100%
            );

    }


    .background::before {

        content: "";

        position: absolute;

        inset: 0;

        opacity: .075;

        background-image:
            linear-gradient(
                rgba(255,255,255,.5) 1px,
                transparent 1px
            ),
            linear-gradient(
                90deg,
                rgba(255,255,255,.5) 1px,
                transparent 1px
            );

        background-size: 46px 46px;

        mask-image:
            linear-gradient(
                to bottom,
                black,
                transparent 82%
            );

    }


    /* =========================================================
       04 — DECORATIVE LIGHTS
       ========================================================= */

    .light {

        position: absolute;

        border-radius: 50%;

        pointer-events: none;

        filter: blur(3px);

        opacity: .75;

        animation:
            drift
            15s
            ease-in-out
            infinite;

    }


    .light-blue {

        width: 330px;

        height: 330px;

        left: -170px;

        top: -140px;

        background:
            radial-gradient(
                circle,
                rgba(33,121,198,.45),
                transparent 68%
            );

    }


    .light-orange {

        width: 390px;

        height: 390px;

        right: -190px;

        bottom: -190px;

        background:
            radial-gradient(
                circle,
                rgba(242,106,0,.34),
                transparent 68%
            );

        animation-delay: -6s;

    }


    .light-small {

        width: 170px;

        height: 170px;

        right: 14%;

        top: 7%;

        background:
            radial-gradient(
                circle,
                rgba(255,255,255,.09),
                transparent 70%
            );

        animation-delay: -10s;

    }


    @keyframes drift {

        0%,
        100% {
            transform:
                translate3d(0,0,0)
                scale(1);
        }

        50% {
            transform:
                translate3d(18px,-22px,0)
                scale(1.04);
        }

    }


    /* =========================================================
       05 — LOGIN STAGE
       ========================================================= */

    .login-stage {

        position: relative;

        width: min(100%,1040px);

        display: grid;

        place-items: center;

    }


    .login-card {

        position: relative;

        width: min(100%,520px);

        border:
            1px solid
            rgba(255,255,255,.17);

        border-radius:
            var(--radius-card);

        background:
            rgba(255,255,255,.045);

        box-shadow:
            var(--shadow-xl);

        backdrop-filter:
            blur(30px)
            saturate(135%);

        -webkit-backdrop-filter:
            blur(30px)
            saturate(135%);

        overflow: hidden;

        animation:
            cardEntrance
            .85s
            var(--ease)
            both;

        will-change: transform;

    }


    .login-card::before {

        content: "";

        position: absolute;

        inset: 0;

        pointer-events: none;

        border-radius: inherit;

        background:
            linear-gradient(
                135deg,
                rgba(255,255,255,.15),
                transparent 30%,
                transparent 68%,
                rgba(242,106,0,.07)
            );

    }


    .login-card::after {

        content: "";

        position: absolute;

        top: 0;

        left: 10%;

        width: 80%;

        height: 1px;

        background:
            linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,.50),
                transparent
            );

    }


    @keyframes cardEntrance {

        from {

            opacity: 0;

            transform:
                translateY(30px)
                scale(.975);

        }

        to {

            opacity: 1;

            transform:
                translateY(0)
                scale(1);

        }

    }


    /* =========================================================
       06 — CARD CONTENT
       ========================================================= */

    .card-inner {

        position: relative;

        z-index: 2;

        padding:
            clamp(25px,6vw,48px);

    }


    /* =========================================================
       07 — BRAND
       ========================================================= */

    .brand {

        display: flex;

        flex-direction: column;

        align-items: center;

        text-align: center;

    }


    .logo-frame {

        position: relative;

        width: 92px;

        height: 92px;

        display: grid;

        place-items: center;

        border:
            1px solid
            rgba(255,255,255,.20);

        border-radius: 28px;

        background:
            rgba(255,255,255,.055);

        box-shadow:
            inset 0 1px 0 rgba(255,255,255,.16),
            0 18px 40px rgba(0,0,0,.20);

        overflow: hidden;

        animation:
            logoEntrance
            .9s
            .08s
            var(--ease)
            both;

    }


    .logo-frame::before {

        content: "";

        position: absolute;

        inset: 8px;

        border:
            1px solid
            rgba(242,106,0,.30);

        border-radius: 21px;

        pointer-events: none;

    }


    .logo-frame::after {

        content: "";

        position: absolute;

        width: 70px;

        height: 70px;

        border-radius: 50%;

        background:
            rgba(242,106,0,.10);

        filter: blur(15px);

    }


    .logo-frame img {

        position: relative;

        z-index: 2;

        width: 76px;

        height: 76px;

        object-fit: contain;

        filter:
            drop-shadow(
                0 8px 18px
                rgba(0,0,0,.25)
            );

    }


    @keyframes logoEntrance {

        from {

            opacity: 0;

            transform:
                translateY(-14px)
                scale(.86)
                rotate(-3deg);

        }

        to {

            opacity: 1;

            transform:
                translateY(0)
                scale(1)
                rotate(0);

        }

    }


    .brand-name {

        margin-top: 18px;

        color: white;

        font-size: 18px;

        font-weight: 850;

        letter-spacing: 2.2px;

    }


    .brand-subtitle {

        margin-top: 7px;

        color:
            rgba(255,255,255,.56);

        font-size: 11px;

        font-weight: 700;

        letter-spacing: 1.8px;

        text-transform: uppercase;

    }


    /* =========================================================
       08 — ADMIN BADGE
       ========================================================= */

    .admin-badge {

        display: inline-flex;

        align-items: center;

        gap: 9px;

        margin-top: 28px;

        padding: 9px 13px;

        border:
            1px solid
            rgba(242,106,0,.24);

        border-radius: 999px;

        background:
            rgba(242,106,0,.08);

        color: #FFC19B;

        font-size: 10px;

        font-weight: 800;

        letter-spacing: 1.2px;

        text-transform: uppercase;

    }


    .admin-dot {

        width: 7px;

        height: 7px;

        border-radius: 50%;

        background: var(--orange-500);

        box-shadow:
            0 0 0 4px rgba(242,106,0,.10),
            0 0 15px rgba(242,106,0,.65);

        animation:
            pulseDot
            2.2s
            ease-in-out
            infinite;

    }


    @keyframes pulseDot {

        0%,
        100% {
            opacity: .7;
            transform: scale(.92);
        }

        50% {
            opacity: 1;
            transform: scale(1.12);
        }

    }


    /* =========================================================
       09 — HEADING
       ========================================================= */

    .heading {

        margin-top: 27px;

        text-align: center;

    }


    .heading h1 {

        color: white;

        font-size:
            clamp(28px,6vw,38px);

        line-height: 1.02;

        letter-spacing: -1.7px;

        font-weight: 850;

    }


    .heading h1 span {

        color: var(--orange-500);

    }


    .heading p {

        max-width: 400px;

        margin: 13px auto 0;

        color:
            rgba(255,255,255,.56);

        font-size: 13px;

        line-height: 1.7;

    }


    /* =========================================================
       10 — ALERT
       ========================================================= */

    .alert {

        display: none;

        align-items: flex-start;

        gap: 11px;

        margin-top: 22px;

        padding: 13px 14px;

        border:
            1px solid
            rgba(255,92,92,.20);

        border-radius: 15px;

        background:
            rgba(255,92,92,.075);

        color: #FFB4B4;

        font-size: 12px;

        line-height: 1.55;

    }


    .alert.show {

        display: flex;

        animation:
            alertEntrance
            .3s
            var(--ease)
            both;

    }


    .alert-icon {

        flex: 0 0 auto;

        width: 26px;

        height: 26px;

        display: grid;

        place-items: center;

        border-radius: 9px;

        background:
            rgba(255,92,92,.12);

    }


    @keyframes alertEntrance {

        from {
            opacity: 0;
            transform: translateY(-6px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }

    }


    /* =========================================================
       11 — FORM
       ========================================================= */

    .login-form {

        margin-top: 28px;

    }


    .field {

        margin-bottom: 18px;

    }


    .field-label {

        display: flex;

        align-items: center;

        justify-content: space-between;

        margin-bottom: 8px;

        color:
            rgba(255,255,255,.82);

        font-size: 11px;

        font-weight: 800;

        letter-spacing: .3px;

    }


    .field-label span:last-child {

        color:
            rgba(255,255,255,.36);

        font-weight: 600;

    }


    .input-shell {

        position: relative;

    }


    .input-icon {

        position: absolute;

        left: 16px;

        top: 50%;

        width: 18px;

        height: 18px;

        transform:
            translateY(-50%);

        color:
            rgba(255,255,255,.38);

        pointer-events: none;

        transition:
            color .2s ease;

    }


    .input {

        width: 100%;

        height: 58px;

        padding: 0 48px;

        border:
            1px solid
            rgba(255,255,255,.13);

        border-radius:
            var(--radius-input);

        outline: none;

        background:
            rgba(255,255,255,.055);

        color: white;

        caret-color:
            var(--orange-500);

        font-size: 14px;

        transition:
            border-color .2s ease,
            background .2s ease,
            box-shadow .2s ease;

    }


    .input::placeholder {

        color:
            rgba(255,255,255,.32);

    }


    .input:hover {

        border-color:
            rgba(255,255,255,.22);

        background:
            rgba(255,255,255,.065);

    }


    .input:focus {

        border-color:
            rgba(242,106,0,.72);

        background:
            rgba(255,255,255,.075);

        box-shadow:
            0 0 0 4px rgba(242,106,0,.10),
            0 10px 30px rgba(0,0,0,.12);

    }


    .input-shell:focus-within
    .input-icon {

        color:
            var(--orange-500);

    }


    /* =========================================================
       12 — PASSWORD
       ========================================================= */

    .password-toggle {

        position: absolute;

        right: 10px;

        top: 50%;

        width: 38px;

        height: 38px;

        transform:
            translateY(-50%);

        display: grid;

        place-items: center;

        border-radius: 11px;

        background: transparent;

        color:
            rgba(255,255,255,.42);

        cursor: pointer;

        transition:
            background .2s ease,
            color .2s ease,
            transform .2s ease;

    }


    .password-toggle:hover {

        color: white;

        background:
            rgba(255,255,255,.08);

    }


    .password-toggle:active {

        transform:
            translateY(-50%)
            scale(.94);

    }


    /* =========================================================
       13 — OPTIONS
       ========================================================= */

    .form-options {

        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 12px;

        margin: 5px 0 22px;

    }


    .remember {

        display: inline-flex;

        align-items: center;

        gap: 8px;

        color:
            rgba(255,255,255,.50);

        font-size: 11px;

        cursor: pointer;

    }


    .remember input {

        width: 15px;

        height: 15px;

        accent-color:
            var(--orange-500);

        cursor: pointer;

    }


    .forgot {

        color: #FFAA76;

        font-size: 11px;

        font-weight: 750;

        text-decoration: none;

    }


    .forgot:hover {

        color: white;

        text-decoration: underline;

    }


    /* =========================================================
       14 — SUBMIT
       ========================================================= */

    .submit-button {

        position: relative;

        width: 100%;

        min-height: 59px;

        display: flex;

        align-items: center;

        justify-content: center;

        gap: 10px;

        border-radius:
            var(--radius-button);

        color: white;

        background:
            linear-gradient(
                135deg,
                var(--orange-700),
                var(--orange-500)
            );

        box-shadow:
            var(--shadow-orange);

        cursor: pointer;

        overflow: hidden;

        font-size: 13px;

        font-weight: 850;

        letter-spacing: .15px;

        transition:
            transform .2s var(--ease),
            box-shadow .2s ease,
            filter .2s ease;

    }


    .submit-button::before {

        content: "";

        position: absolute;

        top: 0;

        bottom: 0;

        left: -120%;

        width: 70%;

        background:
            linear-gradient(
                100deg,
                transparent,
                rgba(255,255,255,.28),
                transparent
            );

        transform: skewX(-18deg);

        transition:
            left .7s ease;

    }


    .submit-button:hover {

        transform:
            translateY(-2px);

        box-shadow:
            0 19px 50px
            rgba(242,106,0,.32);

        filter: brightness(1.06);

    }


    .submit-button:hover::before {

        left: 150%;

    }


    .submit-button:active {

        transform:
            translateY(0)
            scale(.985);

    }


    .submit-button:disabled {

        cursor: not-allowed;

        opacity: .75;

    }


    .button-spinner {

        width: 18px;

        height: 18px;

        border:
            2px solid
            rgba(255,255,255,.35);

        border-top-color: white;

        border-radius: 50%;

        animation:
            spin
            .7s
            linear
            infinite;

    }


    @keyframes spin {

        to {
            transform: rotate(360deg);
        }

    }


    /* =========================================================
       15 — FOOTER
       ========================================================= */

    .security-footer {

        margin-top: 24px;

        padding-top: 20px;

        border-top:
            1px solid
            rgba(255,255,255,.08);

        text-align: center;

    }


    .secure-line {

        display: inline-flex;

        align-items: center;

        justify-content: center;

        gap: 7px;

        color:
            rgba(255,255,255,.40);

        font-size: 10px;

        letter-spacing: .25px;

    }


    .secure-line svg {

        color:
            var(--success);

    }


    .copyright {

        margin-top: 9px;

        color:
            rgba(255,255,255,.23);

        font-size: 9px;

    }


    /* =========================================================
       16 — ERROR SHAKE
       ========================================================= */

    .violent-shake {

        animation:
            violentShake
            .52s
            cubic-bezier(.36,.07,.19,.97)
            both;

    }


    @keyframes violentShake {

        0%,
        100% {
            transform: translate3d(0,0,0);
        }

        10% {
            transform: translate3d(-10px,0,0);
        }

        20% {
            transform: translate3d(11px,0,0);
        }

        30% {
            transform: translate3d(-9px,0,0);
        }

        40% {
            transform: translate3d(8px,0,0);
        }

        50% {
            transform: translate3d(-6px,0,0);
        }

        60% {
            transform: translate3d(5px,0,0);
        }

        70% {
            transform: translate3d(-3px,0,0);
        }

        80% {
            transform: translate3d(2px,0,0);
        }

    }


    /* =========================================================
       17 — MOBILE
       ========================================================= */

    @media (max-width:560px) {

        .app {

            padding: 10px;

            align-items: center;

        }


        .login-card {

            border-radius: 27px;

        }


        .card-inner {

            padding:
                25px 20px 21px;

        }


        .logo-frame {

            width: 76px;

            height: 76px;

            border-radius: 23px;

        }


        .logo-frame img {

            width: 62px;

            height: 62px;

        }


        .brand-name {

            font-size: 16px;

            letter-spacing: 1.7px;

        }


        .brand-subtitle {

            font-size: 9px;

            letter-spacing: 1.3px;

        }


        .admin-badge {

            margin-top: 21px;

        }


        .heading {

            margin-top: 22px;

        }


        .heading h1 {

            font-size: 29px;

        }


        .heading p {

            font-size: 12px;

        }


        .input {

            height: 55px;

        }


        .submit-button {

            min-height: 56px;

        }

    }


    /* =========================================================
       18 — VERY SMALL DEVICES
       ========================================================= */

    @media (max-height:700px) and (max-width:560px) {

        .card-inner {

            padding-top: 18px;

            padding-bottom: 17px;

        }


        .logo-frame {

            width: 65px;

            height: 65px;

        }


        .logo-frame img {

            width: 53px;

            height: 53px;

        }


        .brand-name {

            margin-top: 10px;

        }


        .admin-badge {

            margin-top: 14px;

        }


        .heading {

            margin-top: 15px;

        }


        .heading p {

            margin-top: 8px;

        }


        .login-form {

            margin-top: 20px;

        }


        .field {

            margin-bottom: 12px;

        }


        .security-footer {

            margin-top: 15px;

            padding-top: 12px;

        }

    }


    /* =========================================================
       19 — REDUCED MOTION
       ========================================================= */

    @media (prefers-reduced-motion:reduce) {

        *,
        *::before,
        *::after {

            animation-duration:
                .01ms !important;

            animation-iteration-count:
                1 !important;

            transition-duration:
                .01ms !important;

            scroll-behavior:
                auto !important;

        }

    }

</style>

/* =========================================================
   04 — SUPABASE INITIALIZATION
   ========================================================= */

function initializeSupabase() {

    if (
        !window.supabase ||
        typeof window.supabase.createClient !== "function"
    ) {

        return false;

    }


    try {

        supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY,
                {
                    auth: {
                        autoRefreshToken: true,
                        persistSession: true,
                        detectSessionInUrl: false
                    }
                }
            );


        return true;

    } catch (error) {

        console.error(
            "Supabase initialization failed:",
            error
        );

        supabaseClient = null;

        return false;

    }

}


/* =========================================================
   05 — ERROR SOUND
   ========================================================= */

function getAudioContext() {

    if (audioContext) {

        return audioContext;

    }


    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;


    if (!AudioContext) {

        return null;

    }


    audioContext =
        new AudioContext();


    return audioContext;

}


function playErrorSound() {

    try {

        const context =
            getAudioContext();


        if (!context) {

            return;

        }


        if (
            context.state === "suspended"
        ) {

            context.resume().catch(() => {});

        }


        const now =
            context.currentTime;


        const oscillator =
            context.createOscillator();

        const gain =
            context.createGain();


        oscillator.type =
            "sine";


        oscillator.frequency.setValueAtTime(
            220,
            now
        );


        oscillator.frequency.exponentialRampToValueAtTime(
            110,
            now + .18
        );


        gain.gain.setValueAtTime(
            .0001,
            now
        );


        gain.gain.exponentialRampToValueAtTime(
            .12,
            now + .015
        );


        gain.gain.exponentialRampToValueAtTime(
            .0001,
            now + .22
        );


        oscillator.connect(gain);

        gain.connect(
            context.destination
        );


        oscillator.start(now);

        oscillator.stop(
            now + .24
        );

    } catch (error) {

        console.debug(
            "Audio feedback unavailable.",
            error
        );

    }

}


/* =========================================================
   06 — VIBRATION
   ========================================================= */

function vibrateError() {

    if (
        typeof navigator.vibrate !== "function"
    ) {

        return;

    }


    try {

        navigator.vibrate([
            100,
            45,
            120,
            45,
            160
        ]);

    } catch (error) {

        console.debug(
            "Vibration unavailable.",
            error
        );

    }

}

   07 — ERROR DISPLAY
   ========================================================= */

function clearError() {

    alertBox.classList.remove(

}

    void loginCard.offsetWidth;


    loginCard.classList.add(
        "violent-shake"
    );


    vibrateError();

    playErrorSound();

}

/* =========================================================
   09 — LOADING STATE
   ========================================================= */

function setLoading(
    loading
) {

    submitButton.disabled =
        loading;


    if (loading) {

        buttonContent.textContent =
            "Authenticating...";


        buttonArrow.style.display =
            "none";

            );

        }

    } else {

        buttonContent.textContent =
            "Sign in securely";

            "block";

            document.getElementById(
                "buttonSpinner"
            );


        if (spinner) {

            spinner.remove();

        }

    }

}


/* =========================================================
   10 — VALIDATION
   ========================================================= */

function validateEmail(
    email
) {

    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
        .test(email);

}


function validateForm() {

    const email =
        identifierInput.value
            .trim()
            .toLowerCase();

    const password =
        passwordInput.value;


    if (!email) {

        triggerErrorEffect(
            "Enter your Super Administrator email address."
        );

        identifierInput.focus();

        return false;

    }


    if (!validateEmail(email)) {

        triggerErrorEffect(
            "Enter a valid administrator email address."
        );

        identifierInput.focus();

        return false;

    }


    if (!password) {

        triggerErrorEffect(
            "Enter your administrator password."
        );

        passwordInput.focus();

        return false;

    }


    if (password.length < 8) {

        triggerErrorEffect(
            "The password must contain at least 8 characters."
        );

        passwordInput.focus();

        return false;

    }


    return true;

}


/* =========================================================
   11 — PROFILE AUTHORIZATION
   ========================================================= */

async function verifySuperAdmin(
    userId
) {

    if (!supabaseClient) {

        throw new Error(
            "Authentication service is unavailable."
        );

    }


    const result =
        await supabaseClient
            .from("profiles")
            .select(
                "id,full_name,role,account_status"
            )
            .eq(
                "id",
                userId
            )
            .maybeSingle();


    if (result.error) {

        console.error(
            "Profile verification error:",
            result.error
        );


        throw new Error(
            "Your administrator profile could not be verified. Please contact the system administrator."
        );

    }


    const profile =
        result.data;


    if (!profile) {

        throw new Error(
            "Your administrator profile is not configured."
        );

    }


    if (
        profile.role !==
        SUPER_ADMIN_ROLE
    ) {

        throw new Error(
            "This account is not authorized for Super Administrator access."
        );

    }


    if (
        profile.account_status !==
        ACTIVE_STATUS
    ) {

        throw new Error(
            "This administrator account is currently inactive."
        );

    }


    return profile;

}


/* =========================================================
   12 — SAFE REDIRECT
   ========================================================= */

function redirectToDashboard() {

    if (isRedirecting) {

        return;

    }


    isRedirecting = true;


    /*
       Use replace instead of href.

       This prevents the successful login page from remaining
       in the browser history and guarantees that the dashboard
       becomes the next application route.
    */

    window.location.replace(
        DASHBOARD_PAGE
    );

}


/* =========================================================
   13 — SIGN IN
   ========================================================= */

async function signInSuperAdmin() {

    if (isRedirecting) {

        return;

    }


    clearError();


    if (!validateForm()) {

        return;

    }


    if (!supabaseClient) {

        triggerErrorEffect(
            "The authentication service is unavailable. Please refresh the page and try again."
        );

        return;

    }


    const email =
        identifierInput.value
            .trim()
            .toLowerCase();


    const password =
        passwordInput.value;


    setLoading(true);


    let authenticationSucceeded =
        false;


    try {

        /*
           Step 1:
           Authenticate through Supabase Auth.

           No password is stored locally.
        */

        const {
            data,
            error
        } =
            await supabaseClient.auth
                .signInWithPassword({
                    email,
                    password
                });


        if (error) {

            console.error(
                "Supabase sign-in error:",
                error
            );


            throw new Error(
                "The email or password is incorrect."
            );

        }


        if (
            !data?.user?.id
        ) {

            throw new Error(
                "Authentication could not be completed."
            );

        }


        authenticationSucceeded =
            true;


        /*
           Step 2:
           Verify database authorization.
        */

        await verifySuperAdmin(
            data.user.id
        );


        /*
           Step 3:
           Save only the non-sensitive preference.
        */

        if (
            rememberDevice.checked
        ) {

            localStorage.setItem(
                "almafaaz_remember_device",
                "true"
            );

        } else {

            localStorage.removeItem(
                "almafaaz_remember_device"
            );

        }


        /*
           Step 4:
           Successful access.
        */

        buttonContent.textContent =
            "Access granted";


        buttonArrow.style.display =
            "none";


        /*
           Remove the spinner before redirect.
        */

        const spinner =
            document.getElementById(
                "buttonSpinner"
            );


        if (spinner) {

            spinner.remove();

        }


        /*
           Give the browser one rendering cycle to display
           "Access granted", then immediately navigate.
        */

        await new Promise(
            resolve =>
                requestAnimationFrame(
                    resolve
                )
        );


        redirectToDashboard();


    } catch (error) {

        console.error(
            "Super Administrator authentication failed:",
            error
        );


        /*
           If authentication happened but profile authorization
           failed, destroy the session immediately.
        */

        if (
            authenticationSucceeded &&
            supabaseClient
        ) {

            try {

                await supabaseClient.auth.signOut();

            } catch (signOutError) {

                console.debug(
                    "Session cleanup failed:",
                    signOutError
                );

            }

        }


        if (!isRedirecting) {

            triggerErrorEffect(
                error?.message ||
                "Unable to sign in. Please try again."
            );

        }

    } finally {

        /*
           Do not interfere with an active redirect.
        */

        if (!isRedirecting) {

            setLoading(false);

        }

    }

}

/* =========================================================
   17 — EXISTING SESSION
   ========================================================= */

async function checkExistingSession() {

    if (!supabaseClient) {

        return;

    }


    try {

        const {
            data,
            error
        } =
            await supabaseClient.auth
                .getSession();


        if (error) {

            console.debug(
                "Existing session check error:",
                error
            );

            return;

        }


        const session =
            data?.session;


        if (!session?.user) {

            return;

        }


        /*
           Verify the existing session against the database.
        */

        await verifySuperAdmin(
            session.user.id
        );


        /*
           A valid active Super Admin session already exists.
           Go directly to the protected dashboard.
        */

        redirectToDashboard();


    } catch (error) {

        /*
           Invalid or stale session.

           Clean it up and remain on login.
        */

        console.debug(
            "Existing session is not authorized.",
            error
        );


        try {

            await supabaseClient.auth.signOut();

        } catch (signOutError) {

            console.debug(
                "Unable to clear stale session.",
                signOutError
            );

        }

    }

}


/* =========================================================
   18 — AUTH STATE
   ========================================================= */

function attachAuthListener() {

    if (!supabaseClient) {

        return;

    }


    supabaseClient.auth.onAuthStateChange(
        (event, session) => {

            /*
               If the authenticated user signs out while on
               this page, simply remain on the login page.

               A valid signed-in session is redirected to the
               dashboard through the explicit login/session flow.
            */

            if (
                event === "SIGNED_OUT"
            ) {

                isRedirecting = false;

                setLoading(false);

                return;

            }


            /*
               If another part of the application creates a valid
               session while this page is open, verify it before
               navigating.
            */

            if (
                event === "SIGNED_IN" &&
                session?.user &&
                !isRedirecting
            ) {

                verifySuperAdmin(
                    session.user.id
                )
                .then(
                    profile => {

                        if (
                            profile &&
                            profile.role ===
                                SUPER_ADMIN_ROLE &&
                            profile.account_status ===
                                ACTIVE_STATUS
                        ) {

                            redirectToDashboard();

                        }

                    }
                )
                .catch(
                    error => {

                        console.debug(
                            "SIGNED_IN authorization check failed.",
                            error
                        );

                    }
                );

            }

        }
    );

}

}

   20 — APPLICATION STARTUP
   ========================================================= */

async function initializeApplication() {

    restoreRememberPreference();


    const ready =
        initializeSupabase();


    if (!ready) {

        triggerErrorEffect(
            "Authentication library could not be loaded. Check your internet connection and refresh the page."
        );

        return;

    }


    attachAuthListener();


    /*
       Check existing authenticated session after Supabase
       has been initialized.
    */

    await checkExistingSession();

}


/* =========================================================
   21 — DOM READY
   ========================================================= */

if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        initializeApplication,
        {
            once: true
        }
    );

} else {

    initializeApplication();

}


/* =========================================================
   22 — KEYBOARD
   ========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            clearError();

        }

    }
);

</script></body>
</html>
