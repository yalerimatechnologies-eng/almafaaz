function fh(f){var k=f[0],l=f[1],t=f[2]||"text",o=f[3]||{},v=S.set[k],id="f_"+k;
 if(t==="grading")return '<div class="full"><label>Grading scale</label><div class="hint" style="margin:0 0 8px">A score gets the highest grade whose minimum it reaches. Include a row with minimum 0.</div><div id="grades"></div><button class="btn sm" type="button" id="addGr">Add grade</button><div class="err" id="e_grading"></div></div>';
 if(t==="notif"){var n=S.set.notification_preferences||{};return '<div class="full"><label>Notifications</label><label class="ck"><input type="checkbox" id="n_pay"'+(n.payment_received?" checked":"")+'> Notify when a payment is recorded</label><label class="ck"><input type="checkbox" id="n_rep"'+(n.report_generated?" checked":"")+'> Notify when a report is generated</label><div class="hint">Preferences are stored now. Delivery needs a notification service to be connected.</div></div>'}
 if(t==="chk")return '<div class="full"><label class="ck"><input type="checkbox" id="'+id+'"'+(v!==false&&v?" checked":"")+'> '+esc(l)+'</label></div>';
 var i;
 if(t==="select")i='<select id="'+id+'">'+o.opts.map(function(x){var a=Array.isArray(x)?x:[x,x];return '<option value="'+esc(a[0])+'"'+(String(v)===String(a[0])?" selected":"")+'>'+esc(a[1])+'</option>'}).join("")+'</select>';
 else if(t==="textarea")i='<textarea id="'+id+'" maxlength="600">'+esc(v||"")+'</textarea>';
 else i='<input id="'+id+'" type="'+t+'" value="'+esc(v==null?"":v)+'"'+(o.min!=null?' min="'+o.min+'"':"")+(o.max!=null?' max="'+o.max+'"':"")+(o.step?' step="'+o.step+'"':' ')+(o.ph?' placeholder="'+esc(o.ph)+'"':"")+'>';
 return '<div'+(o.full||t==="textarea"?' class="full"':"")+'><label for="'+id+'">'+esc(l)+(o.req?" *":"")+'</label>'+i+(o.prev?'<img class="prev" id="pv_'+k+'" alt="" hidden>':"")+(o.hint?'<div class="hint">'+esc(o.hint)+'</div>':"")+'<div class="err" id="e_'+k+'"></div></div>'}
function render(){
 G=JSON.parse(JSON.stringify(S.set.grading_scale||[]));
 $("#tabs").innerHTML=SEC.map(function(s){return '<button type="button" class="tab" role="tab" data-t="'+s.id+'" aria-selected="'+(s.id===tab)+'">'+s.t+'</button>'}).join("");
 $("#form").innerHTML=SEC.map(function(s){return '<section class="panel" role="tabpanel" id="p_'+s.id+'"'+(s.id===tab?"":" hidden")+'><div class="panel-h"><h2>'+s.t+'</h2></div><div class="fg">'+s.f.map(fh).join("")+'</div></section>'}).join("");
 drawG();["school_logo_url","report_logo_url"].forEach(prev);setDirty(false)}
function prev(k){var i=$("#f_"+k),p=$("#pv_"+k);if(!i||!p)return;var v=i.value.trim();if(v){p.src=v;p.hidden=false;p.onerror=function(){p.hidden=true}}else p.hidden=true}
function drawG(){var el=$("#grades");if(!el)return;
 el.innerHTML='<div class="gr gh"><span>Grade</span><span>Min score</span><span>Remark</span><span></span></div>'+G.map(function(g,i){return '<div class="gr"><input data-g="grade" data-i="'+i+'" value="'+esc(g.grade)+'" maxlength="3" aria-label="Grade"><input data-g="min" data-i="'+i+'" type="number" min="0" max="100" value="'+esc(g.min)+'" aria-label="Minimum score"><input data-g="remark" data-i="'+i+'" value="'+esc(g.remark||"")+'" aria-label="Remark"><button type="button" class="ib" data-del="'+i+'" aria-label="Remove grade">&times;</button></div>'}).join("")}
function setDirty(d){dirty=d;$("#saveBtn").disabled=!d;$("#discBtn").disabled=!d;$("#dirtyLbl").textContent=d?"You have unsaved changes.":""}
$("#tabs").addEventListener("click",function(e){var b=e.target.closest(".tab");if(b)show(b.dataset.t)});
function show(id){tab=id;document.querySelectorAll(".tab").forEach(function(b){b.setAttribute("aria-selected",b.dataset.t===id)});SEC.forEach(function(s){$("#p_"+s.id).hidden=s.id!==id})}
$("#form").addEventListener("input",function(e){var t=e.target;
 if(t.dataset.g){var g=G[+t.dataset.i];g[t.dataset.g]=t.dataset.g==="min"?(t.value===""?"":parseFloat(t.value)):t.value}
 if(t.id==="f_school_logo_url")prev("school_logo_url");if(t.id==="f_report_logo_url")prev("report_logo_url");setDirty(true)});
$("#form").addEventListener("change",function(){setDirty(true)});
$("#form").addEventListener("click",function(e){
 if(e.target.id==="addGr"){G.push({grade:"",min:"",remark:""});drawG();setDirty(true)}
 var d=e.target.closest("[data-del]");if(d){G.splice(+d.dataset.del,1);drawG();setDirty(true)}});
$("#form").addEventListener("submit",function(e){e.preventDefault()});
$("#discBtn").onclick=render;
window.addEventListener("beforeunload",function(e){if(dirty){e.preventDefault();e.returnValue=""}});
function collect(){var p={};SEC.forEach(function(s){s.f.forEach(function(f){var k=f[0],t=f[2]||"text",el=$("#f_"+k);if(!el)return;
 if(t==="chk")p[k]=el.checked;else if(t==="number")p[k]=el.value===""?null:parseFloat(el.value);else{var v=el.value.trim();p[k]=v===""?null:v}})});
 p.grading_scale=G.map(function(g){return {grade:String(g.grade).trim(),min:Number(g.min),remark:String(g.remark||"").trim()}});
 p.notification_preferences={payment_received:$("#n_pay").checked,report_generated:$("#n_rep").checked};return p}
function validate(p){
 document.querySelectorAll(".err").forEach(function(e){e.textContent=""});var errs=[];
 function bad(k,m){var e=$("#e_"+k);if(e)e.textContent=m;errs.push(k)}
 SEC.forEach(function(s){s.f.forEach(function(f){if((f[3]||{}).req&&(p[f[0]]==null||p[f[0]]===""))bad(f[0],"This field is required.")})});
 if(p.school_email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(p.school_email))bad("school_email","Enter a valid email address.");
 ["school_website","school_logo_url","report_logo_url"].forEach(function(k){if(p[k]&&k==="school_website"&&!/^https?:\/\//i.test(p[k]))bad(k,"Start with http:// or https://")});
 if(p.currency&&!/^[A-Za-z]{3}$/.test(p.currency))bad("currency","Use a three-letter code.");
 if(p.receipt_prefix&&!/^[A-Za-z0-9]{1,10}$/.test(p.receipt_prefix))bad("receipt_prefix","Letters and numbers only, up to 10.");
 if(p.pass_mark!=null&&(p.pass_mark<0||p.pass_mark>100))bad("pass_mark","Enter a value from 0 to 100.");
 if(p.working_days_per_week!=null&&(p.working_days_per_week<1||p.working_days_per_week>7))bad("working_days_per_week","Enter 1 to 7.");
 if(p.term_start_date&&p.term_end_date&&p.term_end_date<p.term_start_date)bad("term_end_date","End date must be after the start date.");
 var gs=p.grading_scale,mins=gs.map(function(g){return g.min});
 if(!gs.length||gs.some(function(g){return !g.grade||isNaN(g.min)||g.min<0||g.min>100})||mins.indexOf(0)<0||mins.some(function(m,i){return mins.indexOf(m)!==i}))bad("grading","Each grade needs a name and a unique minimum from 0 to 100, including one at 0.");
 return errs}
$("#saveBtn").onclick=async function(){
 var p=collect(),errs=validate(p);
 if(errs.length){var f=errs[0],sec=SEC.filter(function(s){return s.f.some(function(x){return x[0]===f})})[0];if(sec)show(sec.id);toast("Please fix the highlighted fields.",true);return}
 var b=this;busy(b,true);
 try{S.set=Object.assign(S.set,await rpc("update_school_settings",{p_settings:p}));setPage();render();toast("Settings updated successfully.")}
 catch(e){fail(e,"settings");$("#saveBtn").disabled=false}finally{busy(b,false)}};
boot(async function(){render()});

})();
</script>
</body>
</html>
